{% load static %}{% load assets %}{% load socialaccount %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Iris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static_v 'chat/app.css' %}">
</head>
<body>
  <main class="shell shell-angosto">
    <header class="topbar">
      <span class="brand" aria-hidden="true">Iris</span>
    </header>

    <section class="propuesta-panel">
      <h1 class="propuesta-titulo">Iniciar sesión</h1>
      <p class="propuesta-intro">
        Iris es de uso interno. Entrá con tu cuenta de Google
        <strong>@{{ GOOGLE_WORKSPACE_DOMAIN }}</strong>.
      </p>

      {% if messages %}
        <div class="propuesta-mensajes" role="alert">
          {% for message in messages %}
            <p class="propuesta-error">{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}

      <a class="google-btn" href="{% provider_login_url 'google' %}">
        <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.96 10.71A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        <span>Continuar con Google</span>
      </a>
    </section>
  </main>
</body>
</html>

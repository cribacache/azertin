{% load assets %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error del servidor · Iris</title>
  <link rel="icon" type="image/png" href="{% static_v 'chat/favicon.png' %}">
  <link rel="stylesheet" href="{% static_v 'chat/app.css' %}">
</head>
<body>
  <main class="shell shell-angosto">
    <header class="topbar">
      <span class="brand" aria-hidden="true">Iris</span>
    </header>

    <section class="propuesta-panel">
      <p class="error-codigo" aria-hidden="true">500</p>
      <h1 class="propuesta-titulo">Error del servidor</h1>
      <p class="propuesta-intro">
        Algo falló de nuestro lado. Probá de nuevo en un rato; si persiste,
        avisale al equipo de Personas.
      </p>
      <a class="backlog-btn" href="{% url 'chat-page' %}">Volver al inicio</a>
    </section>
  </main>
</body>
</html>
